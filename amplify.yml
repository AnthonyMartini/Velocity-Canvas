version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env.production
        - echo "FIREBASE_SERVICE_ACCOUNT='$FIREBASE_SERVICE_ACCOUNT'" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
